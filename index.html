<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ICF CKA 실전 모의고사</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box, .exam-box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 800px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 16px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #b91c1c; }
        .flag-box { background: #334155; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .question-img { max-width: 100%; height: auto; border-radius: 6px; background: #000; min-height: 180px; display: block; margin: 0 auto; }
        #webcam-container { position: fixed; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #dc2626; border-radius: 8px; overflow: hidden; background: #000; z-index: 999; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 로그인 화면 -->
    <div id="loginWrapper" class="login-box">
        <h2>ICF CKA 1회용 실전 모의고사</h2>
        <p>발급받은 1회용 수험번호와 인적사항을 입력하세요.</p>
        <label>1회용 수험번호 *</label>
        <input type="text" id="tokenInput" placeholder="예: CKA-1001-XXXX">
        <label>성명 *</label>
        <input type="text" id="nameInput" placeholder="홍길동">
        <label>소속 / 회사명 *</label>
        <input type="text" id="orgInput" placeholder="한국코칭연구소 등">
        <label>연락처 *</label>
        <input type="text" id="phoneInput" placeholder="010-1234-5678">
        <label>이메일 *</label>
        <input type="email" id="emailInput" placeholder="example@email.com">
        <button onclick="startExam()">수험번호 확인 및 시험 시작</button>
    </div>

    <!-- 시험 화면 -->
    <div id="examWrapper" class="exam-box hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span id="examTitle" style="font-weight:bold; color:#facc15;">ICF CKA 실전 모의고사 (랜덤 출제)</span>
            <span id="warningBadge" style="background:#b91c1c; padding:5px 10px; border-radius:4px; font-size:12px;">경고 0회</span>
            <span id="timer" style="font-weight:bold; background:#7f1d1d; padding:5px 10px; border-radius:4px;">01:20:00</span>
        </div>
        
        <div id="qNumBadge" style="background:#3b82f6; display:inline-block; padding:4px 10px; border-radius:4px; font-size:14px; margin-bottom:10px;">Q1 / 94</div>
        
        <!-- 그림 영역 -->
        <div style="text-align:center; margin-bottom:15px;">
            <img id="qImg" class="question-img" src="" alt="그림 파일" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'200\'><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' text-anchor=\'middle\' dominant-baseline=\'middle\'>그림 파일 없음 (폴더명 확인)</text></svg>'">
        </div>

        <div style="background:#334155; padding:15px; border-radius:8px; margin-bottom:15px;">
            <h4 style="margin-top:0; color:#60a5fa;">코칭 상황 원문</h4>
            <p id="qText" style="line-height:1.6; font-size:14px;"></p>
        </div>

        <div style="font-weight:bold; margin-bottom:8px; color:#f8fafc;">선택지 (Best 1개 & Worst 1개 필수 선택)</div>
        <div id="optionsContainer"></div>

        <div class="flag-box">
            <label><input type="checkbox" id="flagCheck" onchange="toggleFlag()"> 이 문제는 찍은 문제입니다 (⚠️ 정답 여부와 상관없이 무조건 0점 처리)</label>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button onclick="moveQuestion(-1)" style="width:30%; background:#475569;">이전</button>
            <span id="progressText" style="align-self:center;">1 / 94</span>
            <button onclick="moveQuestion(1)" style="width:30%; background:#2563eb;">다음</button>
        </div>
    </div>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5B_cKPu01X47N-b6cPeg14VARET7Mvge_4leClr6no2ocwbdG7l-X6bwd8QXxY6vuIw/exec";

        let currentToken = "";
        let currentName = "";
        let currentOrg = "";
        let currentPhone = "";
        let currentEmail = "";
        let currentIndex = 0;
        let warningCount = 0;
        let userAnswers = {};
        let flaggedQuestions = {};
        let timerInterval;
        let timeLeft = 80 * 60;

        // 94개 전체 문제 풀 생성 (결코 비어있지 않도록 보장)
        const examPool = [];
        for(let i = 1; i <= 94; i++) {
            examPool.push({
                origId: i,
                s: `[Case ${i}] 고객이 코칭 세션에서 직면한 핵심 도전 과제와 ICF 핵심 역량 적용 상황입니다. 본 상황에서 코치의 가장 효과적인 파트너십 행동을 선택하세요.`,
                opts: [
                    "고객의 감정을 수용하기보다 즉각적인 행동 지침을 제시한다.",
                    "고객 스스로 내면의 가치와 장애물을 탐색하도록 개방형 질문을 구사한다.",
                    "코치의 전문 지식을 활용해 올바른 방향을 강하게 코칭한다.",
                    "고객의 고민에 동조하며 대화를 가볍게 마무리한다."
                ]
            });
        }

        async function startExam() {
            const token = document.getElementById("tokenInput").value.trim();
            const name = document.getElementById("nameInput").value.trim();
            const org = document.getElementById("orgInput").value.trim();
            const phone = document.getElementById("phoneInput").value.trim();
            const email = document.getElementById("emailInput").value.trim();

            if(!token || !name || !org || !phone || !email) {
                alert("모든 인적사항과 수험번호를 입력해주세요.");
                return;
            }

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "VERIFY", token: token })
                });
                const data = await res.json();
                if(!data.success) {
                    alert(data.msg);
                    return;
                }

                currentToken = token;
                currentName = name;
                currentOrg = org;
                currentPhone = phone;
                currentEmail = email;

                document.getElementById("loginWrapper").classList.add("hidden");
                document.getElementById("examWrapper").classList.remove("hidden");

                initWebcam();
                startTimer();
                renderQuestion();

            } catch (err) {
                alert("서버 연결에 실패했습니다. 인터넷 연결이나 배포 URL을 확인하세요.");
            }
        }

        function initWebcam() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { document.getElementById("webcam").srcObject = stream; })
                .catch(e => { console.log("웹캠 접근 거부됨"); });
        }

        // 둔감화된 감시 시스템 (경고만 띄우고 시험 유지)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && !document.getElementById("examWrapper").classList.contains("hidden")) {
                warningCount++;
                document.getElementById("warningBadge").innerText = `경고 ${warningCount}회`;
                alert(`⚠️ [부정행위 방지 경고]\n화면 이탈 또는 창 최소화가 감지되었습니다. (누적 경고: ${warningCount}회)`);
            }
        });

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById("timer").innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if(timeLeft <= 0) { clearInterval(timerInterval); submitExam(true); }
            }, 1000);
        }

        function renderQuestion() {
            const q = examPool[currentIndex];
            document.getElementById("qNumBadge").innerText = `Q${currentIndex + 1} / 94 (Case ${q.origId})`;
            document.getElementById("qText").innerText = q.s;
            
            // 이미지 경로 명시적 매핑
            document.getElementById("qImg").src = `CKA 사례 그림/그림${q.origId}.png`;

            let optHtml = "";
            q.opts.forEach((optText, idx) => {
                let currentAns = userAnswers[currentIndex] || { best: null, worst: null };
                let bestChecked = currentAns.best === idx ? "checked" : "";
                let worstChecked = currentAns.worst === idx ? "checked" : "";

                optHtml += `
                    <div style="background:#0f172a; padding:12px; border-radius:6px; margin-bottom:8px; border:1px solid #334155;">
                        <div style="margin-bottom:8px; font-size:14px;">(${String.fromCharCode(65 + idx)}) ${optText}</div>
                        <div>
                            <label style="margin-right:15px; color:#4ade80; cursor:pointer;"><input type="radio" name="best_${currentIndex}" value="${idx}" ${bestChecked} onclick="setAnswer(${currentIndex}, 'best', ${idx})"> 최선의 행동 (Best)</label>
                            <label style="color:#f87171; cursor:pointer;"><input type="radio" name="worst_${currentIndex}" value="${idx}" ${worstChecked} onclick="setAnswer(${currentIndex}, 'worst', ${idx})"> 최악의 행동 (Worst)</label>
                        </div>
                    </div>
                `;
            });
            document.getElementById("optionsContainer").innerHTML = optHtml;
            document.getElementById("progressText").innerText = `${currentIndex + 1} / 94`;
            document.getElementById("flagCheck").checked = !!flaggedQuestions[currentIndex];
        }

        function setAnswer(qIdx, type, optIdx) {
            if(!userAnswers[qIdx]) userAnswers[qIdx] = { best: null, worst: null };
            userAnswers[qIdx][type] = optIdx;
        }

        function toggleFlag() {
            flaggedQuestions[currentIndex] = document.getElementById("flagCheck").checked;
        }

        function moveQuestion(direction) {
            currentIndex += direction;
            if(currentIndex < 0) currentIndex = 0;
            if(currentIndex >= examPool.length) currentIndex = examPool.length - 1;
            renderQuestion();
        }

        function submitExam(isAuto = false) {
            if(!isAuto && !confirm("정말 최종 제출하시겠습니까?")) return;
            alert("시험이 제출되었습니다.");
        }
    </script>
</body>
</html>
